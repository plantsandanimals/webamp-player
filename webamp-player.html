<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webamp</title>

    <!-- Working Webamp CDN -->
    <script src="https://unpkg.com/webamp@latest/dist/webamp.bundle.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: black;
        height: 100%;
        overflow: hidden;
      }

      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: black;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script>
      const Webamp = window.Webamp;

      const webamp = new Webamp({
        initialTracks: [
          { metaData: { title: "ameasi" }, url: "./ameasi.mp3" }
        ],
        initialSkin: {
          url: ".Weed_Amp_bulb_4.wsz"
        }
      });

      webamp.renderWhenReady(document.getElementById("app"));
    </script>
  </body>
</html>
