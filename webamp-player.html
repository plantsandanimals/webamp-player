<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webamp Player</title>

  <!-- Webamp CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/webamp@1.5.0/dist/webamp.min.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Fullscreen stage that centers the player */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
  </style>
</head>

<body>
  <div id="stage"></div>

  <!-- Webamp JS -->
  <script src="https://cdn.jsdelivr.net/npm/webamp@1.5.0/dist/webamp.bundle.min.js"></script>

  <script>
    const webamp = new Webamp({
      initialTracks: [
        { metaData: { artist: "", title: "ameasi" }, url: "./ameasi.mp3" },
        { metaData: { artist: "", title: "bird" }, url: "./bird.mp3" },
        { metaData: { artist: "", title: "choir" }, url: "./choir.mp3" },
        { metaData: { artist: "", title: "don01" }, url: "./don01.mp3" },
        { metaData: { artist: "", title: "don02" }, url: "./don02.mp3" },
        { metaData: { artist: "", title: "don03" }, url: "./don03.mp3" },
        { metaData: { artist: "", title: "don04" }, url: "./don04.mp3" },
        { metaData: { artist: "", title: "don05" }, url: "./don05.mp3" },
        { metaData: { artist: "", title: "don06" }, url: "./don06.mp3" },
        { metaData: { artist: "", title: "don07" }, url: "./don07.mp3" },
        { metaData: { artist: "", title: "don08" }, url: "./don08.mp3" },
        { metaData: { artist: "", title: "don09" }, url: "./don09.mp3" },
        { metaData: { artist: "", title: "don10" }, url: "./don10.mp3" },
        { metaData: { artist: "", title: "don11" }, url: "./don11.mp3" },
        { metaData: { artist: "", title: "kat01" }, url: "./kat01.mp3" },
        { metaData: { artist: "", title: "likehell" }, url: "./likehell.mp3" },
        { metaData: { artist: "", title: "rua01" }, url: "./rua01.mp3" },
        { metaData: { artist: "", title: "rua02" }, url: "./rua02.mp3" },
        { metaData: { artist: "", title: "rua03" }, url: "./rua03.mp3" },
        { metaData: { artist: "", title: "select" }, url: "./select.mp3" },
        { metaData: { artist: "", title: "sup01" }, url: "./sup01.mp3" },
        { metaData: { artist: "", title: "tar01" }, url: "./tar01.mp3" },
        { metaData: { artist: "", title: "tar02" }, url: "./tar02.mp3" },
        { metaData: { artist: "", title: "tar03" }, url: "./tar03.mp3" },
        { metaData: { artist: "", title: "tar04" }, url: "./tar04.mp3" },
        { metaData: { artist: "", title: "tar05" }, url: "./tar05.mp3" },
        { metaData: { artist: "", title: "wan01" }, url: "./wan01.mp3" },
        { metaData: { artist: "", title: "wind" }, url: "./wind.mp3" }
      ],

      initialSkin: {
        url: "./Weed_Amp_bulb_4.wsz"
      }
    });

    webamp.renderWhenReady(document.getElementById("stage"));
  </script>
</body>
</html>
