<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Webamp Player</title>

    <!-- ✅ WORKING Webamp CSS (unpkg 1.4.2) -->
    <link rel="stylesheet" href="https://unpkg.com/webamp@1.4.2/built/webamp.css" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      /* Optional: set the player size so it doesn't collapse */
      #webamp {
        width: 500px;
        height: 520px;
      }

      /* A tiny error banner if scripts fail */
      #err {
        display: none;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        padding: 10px 12px;
        background: #111;
        color: #ffe600;
      }
    </style>
  </head>

  <body>
    <div id="err"></div>
    <div id="webamp"></div>

    <!-- ✅ WORKING Webamp JS (unpkg 1.4.2) -->
    <script src="https://unpkg.com/webamp@1.4.2/built/webamp.bundle.min.js"></script>

    <script>
      (function () {
        const err = document.getElementById("err");

        // If Webamp didn't load, show a helpful message
        if (!window.Webamp) {
          err.style.display = "block";
          err.textContent =
            "Webamp failed to load. This is usually a browser extension/adblock blocking unpkg.com, or the CDN is blocked on your network. Try disabling extensions or using Safari.";
          return;
        }

        // ✅ Your tracks (these files must be in the SAME repo folder as this HTML)
        const tracks = [
          { metaData: { artist: "Plants & Animals", title: "ameasi" }, url: "./ameasi.mp3" },
          { metaData: { artist: "Plants & Animals", title: "bird" }, url: "./bird.mp3" },
          { metaData: { artist: "Plants & Animals", title: "choir" }, url: "./choir.mp3" },

          { metaData: { artist: "Plants & Animals", title: "don01" }, url: "./don01.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don02" }, url: "./don02.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don03" }, url: "./don03.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don04" }, url: "./don04.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don05" }, url: "./don05.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don06" }, url: "./don06.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don07" }, url: "./don07.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don08" }, url: "./don08.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don09" }, url: "./don09.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don10" }, url: "./don10.mp3" },
          { metaData: { artist: "Plants & Animals", title: "don11" }, url: "./don11.mp3" },

          { metaData: { artist: "Plants & Animals", title: "kat01" }, url: "./kat01.mp3" },
          { metaData: { artist: "Plants & Animals", title: "likehell" }, url: "./likehell.mp3" },

          { metaData: { artist: "Plants & Animals", title: "rua01" }, url: "./rua01.mp3" },
          { metaData: { artist: "Plants & Animals", title: "rua02" }, url: "./rua02.mp3" },
          { metaData: { artist: "Plants & Animals", title: "rua03" }, url: "./rua03.mp3" },

          { metaData: { artist: "Plants & Animals", title: "select" }, url: "./select.mp3" },
          { metaData: { artist: "Plants & Animals", title: "sup01" }, url: "./sup01.mp3" },

          { metaData: { artist: "Plants & Animals", title: "tar01" }, url: "./tar01.mp3" },
          { metaData: { artist: "Plants & Animals", title: "tar02" }, url: "./tar02.mp3" },
          { metaData: { artist: "Plants & Animals", title: "tar03" }, url: "./tar03.mp3" },
          { metaData: { artist: "Plants & Animals", title: "tar04" }, url: "./tar04.mp3" },
          { metaData: { artist: "Plants & Animals", title: "tar05" }, url: "./tar05.mp3" },

          { metaData: { artist: "Plants & Animals", title: "wan01" }, url: "./wan01.mp3" },
          { metaData: { artist: "Plants & Animals", title: "wind" }, url: "./wind.mp3" },
        ];

        const webamp = new window.Webamp({
          initialTracks: tracks,

          // ✅ Your skin file in the same folder:
          initialSkin: { url: "./Cannabis_Sativa.wsz" },

          // Optional: start with playlist visible
          __initialWindowLayout: {
            main: { position: { x: 0, y: 0 } },
            playlist: { position: { x: 0, y: 116 } }
          }
        });

        webamp.renderWhenReady(document.getElementById("webamp"));
      })();
    </script>
  </body>
</html>
