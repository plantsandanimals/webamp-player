<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Plants & Animals</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="stage">
    <div id="app"></div>
  </div>

  <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>

  <script>
    const Webamp = window.Webamp;

    const webamp = new Webamp({
      initialTracks: [
        { metaData: { title: "ameasi" }, url: "./ameasi.mp3" },
        { metaData: { title: "bird" }, url: "./bird.mp3" },
        { metaData: { title: "choir" }, url: "./choir.mp3" },
        { metaData: { title: "don01" }, url: "./don01.mp3" },
        { metaData: { title: "don02" }, url: "./don02.mp3" },
        { metaData: { title: "don03" }, url: "./don03.mp3" },
        { metaData: { title: "don04" }, url: "./don04.mp3" },
        { metaData: { title: "don05" }, url: "./don05.mp3" },
        { metaData: { title: "don06" }, url: "./don06.mp3" },
        { metaData: { title: "don07" }, url: "./don07.mp3" },
        { metaData: { title: "don08" }, url: "./don08.mp3" },
        { metaData: { title: "don09" }, url: "./don09.mp3" },
        { metaData: { title: "don10" }, url: "./don10.mp3" },
        { metaData: { title: "don11" }, url: "./don11.mp3" },
        { metaData: { title: "kat01" }, url: "./kat01.mp3" },
        { metaData: { title: "likehell" }, url: "./likehell.mp3" },
        { metaData: { title: "rua01" }, url: "./rua01.mp3" },
        { metaData: { title: "rua02" }, url: "./rua02.mp3" },
        { metaData: { title: "rua03" }, url: "./rua03.mp3" },
        { metaData: { title: "select" }, url: "./select.mp3" },
        { metaData: { title: "sup01" }, url: "./sup01.mp3" },
        { metaData: { title: "tar01" }, url: "./tar01.mp3" },
        { metaData: { title: "tar02" }, url: "./tar02.mp3" },
        { metaData: { title: "tar03" }, url: "./tar03.mp3" },
        { metaData: { title: "tar04" }, url: "./tar04.mp3" },
        { metaData: { title: "tar05" }, url: "./tar05.mp3" },
        { metaData: { title: "wan01" }, url: "./wan01.mp3" },
        { metaData: { title: "wind" }, url: "./wind.mp3" }
      ],
      initialSkin: { url: "./Weed_Amp_bulb_4.wsz" }
    });

    function findWebampRoot() {
      // Webamp usually mounts a root with class "webamp"
      // but this catches other structures too (first child inside #app).
      return document.querySelector("#app .webamp") || document.querySelector("#app > *");
    }

    function fitToScreen() {
      const root = findWebampRoot();
      if (!root) return;

      // Reset transform to measure true size
      root.style.transform = "none";
      root.style.transformOrigin = "center center";

      // Force layout so measurements are real
      const w = root.offsetWidth;
      const h = root.offsetHeight;

      if (!w || !h) return;

      const scale = Math.min(window.innerWidth / w, window.innerHeight / h);

      root.style.transform = `scale(${scale})`;
    }

    webamp.renderWhenReady(document.getElementById("app")).then(() => {
      // Some skins render a moment after "ready", so watch briefly
      const obs = new MutationObserver(() => fitToScreen());
      obs.observe(document.getElementById("app"), { childList: true, subtree: true });

      // Initial + resize
      fitToScreen();
      window.addEventListener("resize", fitToScreen);

      // Stop observing after a second (enough for skin + windows)
      setTimeout(() => obs.disconnect(), 1500);
    });
  </script>
</body>
</html>
