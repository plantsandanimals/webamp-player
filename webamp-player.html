<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webamp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/webamp@1.5.0/dist/webamp.min.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* Force space for the player */
    #webamp {
      width: 480px;
      height: 116px;
    }
  </style>
</head>

<body>
  <div id="webamp"></div>

  <script src="https://cdn.jsdelivr.net/npm/webamp@1.5.0/dist/webamp.min.js"></script>

  <script>
    (async function () {
      try {
        console.log("Starting Webamp…");

        const webamp = new window.Webamp({
          initialTracks: [
            {
              metaData: { artist: "Test Track", title: "It Works" },
              url: "https://archive.org/download/The_Entertainer_1902_Joplin/Scott_Joplin_-_The_Entertainer.mp3"
            }
          ],
          initialSkin: { url: "Cannabis_Sativa.wsz" },
          attachTo: document.getElementById("webamp")
        });

        await webamp.renderWhenReady();
        console.log("Webamp rendered ✅");
      } catch (e) {
        console.error("Webamp failed ❌", e);
        document.body.innerHTML =
          "<pre style='padding:16px;font:14px/1.4 monospace;'>Webamp failed:\\n" +
          (e && (e.stack || e.message) ? (e.stack || e.message) : String(e)) +
          "</pre>";
      }
    })();
  </script>
</body>
</html>
