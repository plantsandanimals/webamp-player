<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webamp Player</title>

  <!-- Webamp styles -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/webamp@latest/dist/webamp.css"
  />
</head>

<body style="margin:0; background:transparent; overflow:hidden;">
  <div id="webamp"></div>

  <!-- Webamp script -->
  <script src="https://unpkg.com/webamp@latest/dist/webamp.bundle.min.js"></script>

  <script>
    const webamp = new Webamp({
      initialTracks: [
        {
          metaData: {
            artist: "Scott Joplin",
            title: "The Entertainer"
          },
          url: "https://archive.org/download/The_Entertainer_1902_Joplin/Scott_Joplin_-_The_Entertainer.mp3"
        }
      ],
      initialSkin: {
        url: "https://plantsandanimals.github.io/webamp-player/Cannabis_Sativa.wsz"
      }
    });

    webamp.renderWhenReady(document.getElementById("webamp"));
  </script>
</body>
</html>
