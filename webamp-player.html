<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webamp Debug</title>

  <style>
    html, body { margin: 0; padding: 0; }
    #status {
      font: 16px/1.4 monospace;
      padding: 14px;
      background: #111;
      color: #0f0;
    }
    #webamp {
      width: 100vw;
      height: 100vh;
      background: #fff;
    }
  </style>

  <!-- Webamp CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/webamp@1.5.0/dist/webamp.min.css">
</head>

<body>
  <div id="status">✅ HTML LOADED. If you can read this, GitHub Pages is serving the file.</div>
  <div id="webamp"></div>

  <!-- Webamp JS -->
  <script src="https://cdn.jsdelivr.net/npm/webamp@1.5.0/dist/webamp.bundle.min.js"></script>

  <script>
    const statusEl = document.getElementById("status");

    try {
      if (typeof window.Webamp !== "function") {
        statusEl.style.color = "#ff0";
        statusEl.textContent =
          "⚠️ HTML loaded, but Webamp JS did NOT load. This is usually an adblock/privacy extension or network blocking cdn.jsdelivr.net. Try Incognito, disable extensions, or use Safari.";
      } else {
        statusEl.textContent = "✅ Webamp JS loaded. Rendering player now...";

        const webamp = new window.Webamp({
          initialTracks: [
            { metaData: { artist: "Plants & Animals", title: "ameasi" }, url: "https://plantsandanimals.github.io/webamp-player/ameasi.mp3" },
            { metaData: { artist: "Plants & Animals", title: "bird" },   url: "https://plantsandanimals.github.io/webamp-player/bird.mp3" },
            { metaData: { artist: "Plants & Animals", title: "choir" },  url: "https://plantsandanimals.github.io/webamp-player/choir.mp3" },
            { metaData: { artist: "Plants & Animals", title: "don01" },  url: "https://plantsandanimals.github.io/webamp-player/don01.mp3" },
            { metaData: { artist: "Plants & Animals", title: "likehell" }, url: "https://plantsandanimals.github.io/webamp-player/likehell.mp3" },
            { metaData: { artist: "Plants & Animals", title: "wind" },   url: "https://plantsandanimals.github.io/webamp-player/wind.mp3" }
          ],
          initialSkin: {
            url: "https://plantsandanimals.github.io/webamp-player/Cannabis_Sativa.wsz"
          }
        });

        webamp.renderWhenReady(document.getElementById("webamp"));
      }
    } catch (e) {
      statusEl.style.color = "#f66";
      statusEl.textContent = "❌ JavaScript error: " + (e && e.message ? e.message : e);
      console.error(e);
    }
  </script>
</body>
</html>
