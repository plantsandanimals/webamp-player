<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webamp Player</title>

  <!-- Webamp styles (CORRECT PATH) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/webamp@latest/built/webamp.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    #webamp {
      width: 480px;
      height: 116px;
    }
  </style>
</head>

<body>
  <div id="webamp"></div>

  <!-- Webamp script (CORRECT PATH) -->
  <script src="https://unpkg.com/webamp@latest/built/webamp.bundle.min.js"></script>

  <script>
    const webamp = new Webamp({
      initialTracks: [
        {
          metaData: {
            artist: "Scott Joplin",
            title: "The Entertainer"
          },
          url: "https://archive.org/download/The_Entertainer_1902_Joplin/Scott_Joplin_-_The_Entertainer.mp3"
        }
      ],
      initialSkin: {
        url: "https://plantsandanimals.github.io/webamp-player/Cannabis_Sativa.wsz"
      }
    });

    webamp.renderWhenReady(document.getElementById("webamp"));
  </script>
</body>
</html>
